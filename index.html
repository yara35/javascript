<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Movement</title>
  <style>
    #road {
      position: relative;
      width: 100%;
      height: 300px;
      background-color: #f0f0f0;
      overflow: hidden;
      border: 2px solid #333;
    }
    .car {
      position: absolute;
      width: 100px;
      transition: all 0.1s linear;
    }
  </style>
</head>
<body>

  <div id="road">
    <img id="car" class="car" src="images/car.jpg" />
  </div>

  <button onclick="car.moveCar('left')">Move Left</button>
  <button onclick="car.moveCar('right')">Move Right</button>
  <button onclick="car.ChangeStyle({transform: 'scale(1.2)', border: '2px solid red'})">Change Style</button>

  <script src="script.js"></script>
</body>
</html>
